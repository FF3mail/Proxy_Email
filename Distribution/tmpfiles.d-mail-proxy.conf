# DELTA-transit mail-proxy log paths (PROMPT-78)
# Applied at boot via systemd-tmpfiles-setup and before each daemon start.
# setgid (2750) on the directory makes new files inherit mail-proxy-logs.
d /var/log/mail-proxy 2750 vmail mail-proxy-logs - -
f /var/log/mail-proxy/mail-proxy-daemon.log 0640 vmail mail-proxy-logs - -
f /var/log/mail-proxy/web_admin.log 0660 vmail mail-proxy-logs - -
